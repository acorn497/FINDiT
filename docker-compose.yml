name: findit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findit}
      POSTGRES_DB: ${POSTGRES_DB:-findit}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: findit-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        EXTRA_CA_PEM: ${EXTRA_CA_PEM:-}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-findit}:${POSTGRES_PASSWORD:-findit}@db:5432/${POSTGRES_DB:-findit}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      # HTTPS 뒤에서 운영할 때만 true (쿠키에 Secure)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 기동 때마다 시드를 넣는다 (멱등). 운영에서 빈 상태로 쓰려면 false
      SEED_ON_START: ${SEED_ON_START:-true}
      TZ: Asia/Seoul
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    image: findit-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        EXTRA_CA_PEM: ${EXTRA_CA_PEM:-}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  # 테스트 전용 (scripts/test-all.sh) — FE 단위 / BE 단위·e2e / Playwright
  e2e:
    image: findit-e2e
    profiles: [e2e]
    build:
      context: .
      dockerfile: scripts/test.Dockerfile
      args:
        EXTRA_CA_PEM: ${EXTRA_CA_PEM:-}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-findit}:${POSTGRES_PASSWORD:-findit}@db:5432/${POSTGRES_DB:-findit}
      BASE_URL: http://web
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
